
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TunLine | Entertainment Database</title>
<style>
:root{--bg:#090d18;--panel:#111827;--line:#252e40;--text:#f4f4fa;--muted:#9da8bb;--purple:#9574ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#101626;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
button{cursor:pointer}
.header-btn{background:none;border:0;color:white;font-size:25px}
.logo{color:var(--purple);font-size:26px;font-weight:900}
main{max-width:1200px;margin:auto;padding:22px 18px}
.total{text-align:center;padding:12px;border-bottom:1px solid var(--line);margin-bottom:24px}
.total small{color:var(--muted);letter-spacing:2px}
.total h1{font-size:32px;margin:8px}
.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.heading h2{margin:0}
.count{color:var(--purple);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 12px}
.post{padding:8px;background:var(--panel);border:1px solid #222c3d;border-radius:10px;cursor:pointer;min-width:0}
.post:hover{border-color:var(--purple);transform:translateY(-3px)}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:#202a3b}
.post h3{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 0}
.category{font-size:11px;color:var(--muted)}
.pagination{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:30px}
.pagination button,.action{padding:9px 13px;background:#171f30;color:white;border:1px solid #303a50;border-radius:7px}
.pagination .active,.primary{background:var(--purple)!important}
footer{text-align:center;padding:25px;border-top:1px solid var(--line);color:var(--muted)}
.sidebar{position:fixed;top:0;left:-290px;width:270px;height:100%;padding:22px;background:var(--panel);z-index:40;transition:.3s}
.sidebar.open{left:0}
.sidebar a{display:block;padding:13px;color:white;text-decoration:none;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:35}
.overlay.active{display:block}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:60;overflow:auto;padding:20px}
.modal.show{display:block}
.modal-content{max-width:850px;margin:25px auto;background:var(--panel);border:1px solid #35405a;border-radius:12px;padding:20px}
.close{float:right;background:none;border:0;color:white;font-size:28px}
.detail{display:grid;grid-template-columns:220px 1fr;gap:22px;margin-top:20px}
.detail img{width:100%;border-radius:8px}
.detail p{color:var(--muted);line-height:1.6}
.admin{display:none;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:10px;margin:20px 0}
.admin.show{display:block}
.admin input{display:block;width:100%;padding:11px;margin:8px 0 15px;background:var(--bg);color:white;border:1px solid #35405a;border-radius:7px}
.notice{color:var(--muted);font-size:13px}
@media(max-width:600px){.grid{gap:9px 7px}.post{padding:5px}.post h3{font-size:11px}.detail{grid-template-columns:110px 1fr;gap:12px}}
</style>
</head>
<body>

<header>
<button class="header-btn" onclick="menu()">☰</button>
<div class="logo">TunLine</div>
<button class="header-btn" onclick="searchToggle()">⌕</button>
</header>

<div id="overlay" class="overlay" onclick="menu()"></div>
<aside id="sidebar" class="sidebar">
<h2 style="color:#9574ff">TunLine</h2>
<a onclick="filter('All')">⌂ Home</a>
<a onclick="filter('Movie')">🎬 Movies</a>
<a onclick="filter('TV Series')">📺 TV Shows</a>
<a onclick="filter('Web Series')">▶ Web Series</a>
<a onclick="filter('Anime')">✦ Anime</a>
<a onclick="filter('Animation')">🎨 Animation</a>
<a onclick="filter('Documentary')">📚 Documentaries</a>
<a onclick="filter('All')">▦ All Entries</a>
<hr>
<a onclick="openAdmin()">⚙ Admin Login</a>
</aside>

<main>
<div id="searchArea" style="display:none;margin-bottom:18px">
<input id="search" placeholder="Search titles..." oninput="render()" style="width:100%;padding:12px;background:#111827;color:white;border:1px solid #35405a;border-radius:8px">
</div>

<section class="total">
<small>TOTAL ENTRIES</small>
<h1 id="total">0000</h1>
</section>

<div class="heading">
<h2 id="sectionTitle">Trending</h2>
<span class="count" id="count">0 POSTS</span>
</div>
<div class="grid" id="grid"></div>
<div class="pagination" id="pages"></div>

<section class="admin" id="admin">
<h2>Admin Panel</h2>
<div id="login">
<p class="notice">Sign in with your authorized Supabase Admin account.</p>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button class="action primary" onclick="login()">Sign in</button>
</div>
<div id="upload" style="display:none">
<label>Title</label>
<input id="title" placeholder="Enter title">
<label>HD Poster</label>
<input id="poster" type="file" accept="image/jpeg,image/png,image/webp">
<button class="action primary" onclick="addEntry()">Upload poster</button>
<button class="action" onclick="logout()">Sign out</button>
<p id="message" class="notice"></p>
</div>
</section>
</main>

<footer><b>TunLine</b><br><br>Your Universe of Entertainment.</footer>

<div class="modal" id="detailModal" onclick="if(event.target===this)closeDetail()">
<div class="modal-content">
<button class="close" onclick="closeDetail()">×</button>
<div id="detailContent"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// PASTE YOUR SUPABASE PROJECT URL AND PUBLISHABLE KEY HERE
const SUPABASE_URL="https://ogneisklckxljckatcro.supabase.co";
const SUPABASE_KEY="sb_publishable_fFlxrkqt5Let8lu0W3L5Ew_yoJzT_69";

// OPTIONAL: PASTE YOUR TMDB API KEY HERE FOR AUTOMATIC DETAILS
const TMDB_KEY="YOUR_TMDB_API_KEY";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let entries=[],page=1,category="All",perPage=15;

function menu(){
 document.getElementById("sidebar").classList.toggle("open");
 document.getElementById("overlay").classList.toggle("active");
}
function searchToggle(){
 const a=document.getElementById("searchArea");
 a.style.display=a.style.display==="none"?"block":"none";
}
function filter(c){
 category=c;page=1;
 document.getElementById("sectionTitle").textContent=c==="All"?"Trending":c;
 menu();render();
}
function publicPoster(path){
 if(!path)return "";
 if(path.startsWith("http"))return path;
 return db.storage.from("posters").getPublicUrl(path).data.publicUrl;
}
async function load(){
 const {data,error}=await db.from("entries")
 .select("*").order("created_at",{ascending:false});
 if(error){document.getElementById("grid").textContent=error.message;return;}
 entries=data||[];render();
}
function render(){
 const q=(document.getElementById("search").value||"").toLowerCase();
 let list=entries.filter(x=>
 (category==="All"||x.category===category)&&
 x.title.toLowerCase().includes(q));
 let totalPages=Math.max(1,Math.ceil(list.length/perPage));
 page=Math.min(page,totalPages);
 let visible=list.slice((page-1)*perPage,page*perPage);
 document.getElementById("total").textContent=String(entries.length).padStart(4,"0");
 document.getElementById("count").textContent=visible.length+" POSTS";
 const grid=document.getElementById("grid");grid.innerHTML="";
 if(!visible.length)grid.innerHTML='<p class="notice">No entries yet. Admin can add the first poster.</p>';
 visible.forEach(p=>{
 const card=document.createElement("article");card.className="post";
 const img=document.createElement("img");img.className="poster";
 img.src=publicPoster(p.poster_path);img.alt=p.title;
 const h=document.createElement("h3");h.textContent=p.title;
 const cat=document.createElement("div");cat.className="category";cat.textContent=p.category||"Entertainment";
 card.append(img,h,cat);card.onclick=()=>details(p);grid.append(card);
 });
 const pages=document.getElementById("pages");pages.innerHTML="";
 if(totalPages>1){
 for(let i=1;i<=totalPages;i++){
 const b=document.createElement("button");b.textContent=i;
 if(i===page)b.className="active";
 b.onclick=()=>{page=i;render();};pages.append(b);
 }}
}
async function details(p){
 const modal=document.getElementById("detailModal");
 modal.classList.add("show");
 const area=document.getElementById("detailContent");
 area.innerHTML="<p>Loading details…</p>";
 let d=null;
 if(TMDB_KEY&&!TMDB_KEY.includes("YOUR_")){
 try{
 const s=await fetch("https://api.themoviedb.org/3/search/multi?query="+encodeURIComponent(p.title)+"&api_key="+TMDB_KEY);
 const j=await s.json();
 const hit=(j.results||[]).find(x=>x.media_type==="movie"||x.media_type==="tv");
 if(hit){
 const r=await fetch(`https://api.themoviedb.org/3/${hit.media_type}/${hit.id}?append_to_response=credits,videos&api_key=${TMDB_KEY}`);
 d=await r.json();d.kind=hit.media_type;
 }
 }catch(e){console.log(e);}
 }
 const year=d?(d.release_date||d.first_air_date||"").slice(0,4):"";
 const genres=d?.genres?.map(x=>x.name).join(", ")||"";
 const cast=d?.credits?.cast?.slice(0,8).map(x=>x.name).join(", ")||"";
 const trailer=d?.videos?.results?.find(x=>x.site==="YouTube"&&x.type==="Trailer");
 const overview=d?.overview||"No external details found yet. Add a TMDB API key to enable automatic information.";
 area.innerHTML=`
 <div class="detail">
 <img src="${publicPoster(p.poster_path)}">
 <div>
 <h2>${d?.title||d?.name||p.title}</h2>
 <p>${year} ${d?.vote_average?" · Rating "+d.vote_average.toFixed(1):""}</p>
 <p>${overview}</p>
 ${genres?`<h3>Genres</h3><p>${genres}</p>`:""}
 ${cast?`<h3>Cast</h3><p>${cast}</p>`:""}
 ${trailer?`<p><a style="color:#bbaaff" target="_blank" href="https://youtube.com/watch?v=${trailer.key}">Watch trailer</a></p>`:""}
 </div></div>`;
}
function closeDetail(){document.getElementById("detailModal").classList.remove("show");}
function openAdmin(){menu();document.getElementById("admin").classList.add("show");document.getElementById("admin").scrollIntoView({behavior:"smooth"});}
async function login(){
 const {data,error}=await db.auth.signInWithPassword({
 email:document.getElementById("email").value,
 password:document.getElementById("password").value
 });
 if(error){document.getElementById("message").textContent=error.message;return;}
 if(data.user.app_metadata.role!=="admin"){
 await db.auth.signOut();
 document.getElementById("message").textContent="This account is not authorized as Admin.";
 return;
 }
 document.getElementById("login").style.display="none";
 document.getElementById("upload").style.display="block";
}
async function addEntry(){
 const title=document.getElementById("title").value.trim();
 const file=document.getElementById("poster").files[0];
 const msg=document.getElementById("message");
 if(!title||!file){msg.textContent="Enter a title and choose a poster.";return;}
 if(file.size>8*1024*1024){msg.textContent="Poster must be under 8 MB.";return;}
 const ext=file.name.split(".").pop().toLowerCase();
 const path=crypto.randomUUID()+"."+ext;
 msg.textContent="Uploading…";
 const up=await db.storage.from("posters").upload(path,file,{contentType:file.type});
 if(up.error){msg.textContent=up.error.message;return;}
 const ins=await db.from("entries").insert({title,poster_path:path});
 if(ins.error){msg.textContent=ins.error.message;return;}
 msg.textContent="Poster added successfully!";
 document.getElementById("title").value="";
 document.getElementById("poster").value="";
 await load();
}
async function logout(){
 await db.auth.signOut();
 document.getElementById("upload").style.display="none";
 document.getElementById("login").style.display="block";
}
load();
</script>
</body>
</html>
