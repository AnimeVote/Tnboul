
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TunLine | Entertainment Database</title>
<style>
:root{--bg:#090d18;--panel:#111827;--line:#252e40;--text:#f4f4fa;--muted:#9da8bb;--purple:#9574ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button{cursor:pointer}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#101626;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.header-btn{background:none;border:0;color:white;font-size:25px}
.logo{color:var(--purple);font-size:26px;font-weight:900}
main{max-width:1200px;margin:auto;padding:22px 18px}
.total{text-align:center;padding:12px;border-bottom:1px solid var(--line);margin-bottom:24px}
.total small{color:var(--muted);letter-spacing:2px}
.total h1{font-size:32px;margin:8px}
.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.heading h2{margin:0}
.count{color:var(--purple);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 12px}
.post{padding:8px;background:var(--panel);border:1px solid #222c3d;border-radius:10px;cursor:pointer;min-width:0}
.post:hover{border-color:var(--purple);transform:translateY(-2px)}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:#202a3b}
.post h3{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 0}
.category{font-size:11px;color:var(--muted)}
.pagination{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:30px}
.pagination button,.action{padding:9px 13px;background:#171f30;color:white;border:1px solid #303a50;border-radius:7px}
.pagination .active,.primary{background:var(--purple)!important}
footer{text-align:center;padding:25px;border-top:1px solid var(--line);color:var(--muted)}
.sidebar{position:fixed;top:0;left:-290px;width:270px;height:100%;padding:22px;background:var(--panel);z-index:40;transition:.3s}
.sidebar.open{left:0}
.sidebar a{display:block;padding:13px;color:white;text-decoration:none;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:35}
.overlay.active{display:block}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:60;overflow:auto;padding:15px}
.modal.show{display:block}
.modal-content{max-width:850px;margin:25px auto;background:var(--panel);border:1px solid #35405a;border-radius:12px;padding:20px}
.close{float:right;background:none;border:0;color:white;font-size:28px}
.detail{display:grid;grid-template-columns:180px 1fr;gap:22px;margin:20px 0}
.detail img{width:100%;border-radius:8px}
.detail p{color:var(--muted);line-height:1.6}
.admin{display:none;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:10px;margin:20px 0}
.admin.show{display:block}
.admin input,.admin select{display:block;width:100%;padding:11px;margin:8px 0 15px;background:var(--bg);color:white;border:1px solid #35405a;border-radius:7px}
.notice{color:var(--muted);font-size:13px;line-height:1.5}
.result{background:#192235;border:1px solid #303a50;border-radius:8px;padding:14px;margin:12px 0}
.result h3{margin:7px 0}
.result p{color:var(--muted);line-height:1.5}
.source{font-size:11px;color:#bbaaff}
.status{color:#bbaaff;font-size:13px}
.danger{background:#692b3b!important}
a{color:#c1b2ff}
@media(max-width:600px){
 .grid{gap:9px 7px}
 .post{padding:5px}
 .post h3{font-size:11px}
 .detail{grid-template-columns:110px 1fr;gap:12px}
 .modal-content{padding:13px}
}
</style>
</head>
<body>

<header>
<button class="header-btn" id="menuBtn" type="button">☰</button>
<div class="logo">TunLine</div>
<button class="header-btn" id="searchBtn" type="button">⌕</button>
</header>

<div id="overlay" class="overlay"></div>

<aside id="sidebar" class="sidebar">
<h2 style="color:#9574ff">TunLine</h2>
<a data-filter="All">⌂ Home</a>
<a data-filter="Movie">🎬 Movies</a>
<a data-filter="TV Series">📺 TV Shows</a>
<a data-filter="Web Series">▶ Web Series</a>
<a data-filter="Anime">✦ Anime</a>
<a data-filter="Animation">🎨 Animation</a>
<a data-filter="Documentary">📚 Documentaries</a>
<a data-filter="All">▦ All Entries</a>
<hr>
<a id="adminLink">⚙ Admin Login</a>
</aside>

<main>
<div id="searchArea" style="display:none;margin-bottom:18px">
<input id="search" placeholder="Search titles..." style="width:100%;padding:12px;background:#111827;color:white;border:1px solid #35405a;border-radius:8px">
</div>

<section class="total">
<small>TOTAL ENTRIES</small>
<h1 id="total">0000</h1>
</section>

<div class="heading">
<h2 id="sectionTitle">Trending</h2>
<span class="count" id="count">0 POSTS</span>
</div>

<div class="grid" id="grid"></div>
<div class="pagination" id="pages"></div>

<section class="admin" id="admin">
<h2>Admin Panel</h2>

<div id="login">
<p class="notice">Sign in with your authorized Supabase Admin account.</p>
<label>Email</label>
<input id="email" type="email" placeholder="Admin email" autocomplete="username">
<label>Password</label>
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button class="action primary" id="loginBtn" type="button">Sign in</button>
<p id="loginMessage" class="notice"></p>
</div>

<div id="upload" style="display:none">
<h3>Add a new entry</h3>
<label>Title</label>
<input id="title" placeholder="Enter title">
<label>Category</label>
<select id="entryCategory">
<option>Movie</option>
<option>TV Series</option>
<option>Web Series</option>
<option>Anime</option>
<option>Animation</option>
<option>Documentary</option>
</select>
<label>HD Poster</label>
<input id="poster" type="file" accept="image/jpeg,image/png,image/webp">
<button class="action primary" id="uploadBtn" type="button">Upload poster</button>
<button class="action" id="logoutBtn" type="button">Sign out</button>
<p id="message" class="notice"></p>
</div>
</section>
</main>

<footer>
<b>TunLine</b><br><br>
Your Universe of Entertainment.
</footer>

<div class="modal" id="detailModal">
<div class="modal-content">
<button class="close" id="closeBtn" type="button">×</button>
<div id="detailContent"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

// EXISTING SUPABASE PROJECT
const SUPABASE_URL="https://ogneisklckxljckatcro.supabase.co";
const SUPABASE_KEY="sb_publishable_fFlxrkqt5Let8lu0W3L5Ew_yoJzT_69";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let entries=[];
let page=1;
let category="All";
let isAdmin=false;
const perPage=15;

const $=id=>document.getElementById(id);

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function safeURL(value){
 try{
  const u=new URL(value);
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch(e){return "";}
}

// MENU
function setMenu(open){
 $("sidebar").classList.toggle("open",open);
 $("overlay").classList.toggle("active",open);
}

$("menuBtn").addEventListener("click",()=>{
 setMenu(!$("sidebar").classList.contains("open"));
});

$("overlay").addEventListener("click",()=>setMenu(false));

// SEARCH
$("searchBtn").addEventListener("click",()=>{
 const area=$("searchArea");
 area.style.display=area.style.display==="none"?"block":"none";
 if(area.style.display==="block")$("search").focus();
});

$("search").addEventListener("input",()=>{
 page=1;
 render();
});

// CATEGORY FILTER
document.querySelectorAll("[data-filter]").forEach(link=>{
 link.addEventListener("click",()=>{
  category=link.dataset.filter;
  page=1;
  $("sectionTitle").textContent=category==="All"?"Trending":category;
  setMenu(false);
  render();
 });
});

// ADMIN PANEL
$("adminLink").addEventListener("click",()=>{
 setMenu(false);
 $("admin").classList.add("show");
 $("admin").scrollIntoView({behavior:"smooth"});
});

// POSTER URL
function publicPoster(path){
 if(!path)return "";
 if(path.startsWith("http"))return path;
 return db.storage.from("posters").getPublicUrl(path).data.publicUrl;
}

// LOAD ENTRIES
async function load(){
 $("grid").textContent="Loading entries…";

 const {data,error}=await db.from("entries")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  $("grid").textContent="Database error: "+error.message;
  return;
 }

 entries=data||[];
 render();
}

// DISPLAY ENTRIES
function render(){
 const q=($("search").value||"").toLowerCase();

 const list=entries.filter(x=>
  (category==="All"||x.category===category)&&
  (x.title||"").toLowerCase().includes(q)
 );

 const totalPages=Math.max(1,Math.ceil(list.length/perPage));
 page=Math.min(page,totalPages);

 const visible=list.slice((page-1)*perPage,page*perPage);

 $("total").textContent=String(entries.length).padStart(4,"0");
 $("count").textContent=visible.length+" POSTS";

 const grid=$("grid");
 grid.innerHTML="";

 if(!visible.length){
  grid.innerHTML='<p class="notice">No entries yet. Admin can add the first poster.</p>';
 }

 visible.forEach(p=>{
  const card=document.createElement("article");
  card.className="post";

  const img=document.createElement("img");
  img.className="poster";
  img.src=publicPoster(p.poster_path);
  img.alt=p.title||"Poster";
  img.loading="lazy";

  const h=document.createElement("h3");
  h.textContent=p.title||"Untitled";

  const cat=document.createElement("div");
  cat.className="category";
  cat.textContent=p.category||"Entertainment";

  card.append(img,h,cat);
  card.addEventListener("click",()=>details(p));
  grid.append(card);
 });

 const pages=$("pages");
 pages.innerHTML="";

 if(totalPages>1){
  for(let i=1;i<=totalPages;i++){
   const b=document.createElement("button");
   b.textContent=i;
   if(i===page)b.className="active";
   b.addEventListener("click",()=>{
    page=i;
    render();
   });
   pages.append(b);
  }
 }
}

// ---------- FREE API HELPERS ----------

async function fetchJSON(url,options={}){
 const response=await fetch(url,options);
 if(!response.ok){
  throw new Error("HTTP "+response.status);
 }
 return response.json();
}

// TVMAZE
async function searchTVmaze(title){
 const data=await fetchJSON(
  "https://api.tvmaze.com/search/shows?q="+encodeURIComponent(title)
 );

 return (data||[]).slice(0,3).map(item=>({
  source:"TVmaze",
  title:item.show.name,
  year:(item.show.premiered||"").slice(0,4),
  description:(item.show.summary||"").replace(/<[^>]*>/g,""),
  genres:(item.show.genres||[]).join(", "),
  rating:item.show.rating?.average||"",
  link:item.show.url
 }));
}

// JIKAN / MYANIMELIST
async function searchJikan(title){
 const data=await fetchJSON(
  "https://api.jikan.moe/v4/anime?q="+encodeURIComponent(title)+"&limit=3"
 );

 return (data.data||[]).map(item=>({
  source:"Jikan / MyAnimeList",
  title:item.title,
  year:item.year||item.aired?.prop?.from?.year||"",
  description:item.synopsis||"No description available.",
  genres:(item.genres||[]).map(g=>g.name).join(", "),
  rating:item.score||"",
  link:item.url
 }));
}

// ANILIST
async function searchAniList(title){
 const query=`
 query ($search:String) {
  Media(search:$search,type:ANIME) {
   title { romaji english }
   description(asHtml:false)
   seasonYear
   genres
   averageScore
   siteUrl
  }
 }`;

 const data=await fetchJSON("https://graphql.anilist.co",{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "Accept":"application/json"
  },
  body:JSON.stringify({
   query,
   variables:{search:title}
  })
 });

 const item=data.data?.Media;
 if(!item)return [];

 return [{
  source:"AniList",
  title:item.title?.english||item.title?.romaji||title,
  year:item.seasonYear||"",
  description:(item.description||"").replace(/<[^>]*>/g," "),
  genres:(item.genres||[]).join(", "),
  rating:item.averageScore?item.averageScore+"/100":"",
  link:item.siteUrl
 }];
}

// WIKIDATA
async function searchWikidata(title){
 const url="https://www.wikidata.org/w/api.php?action=wbsearchentities&search="+
  encodeURIComponent(title)+
  "&language=en&format=json&origin=*";

 const data=await fetchJSON(url);

 return (data.search||[]).slice(0,3).map(item=>({
  source:"Wikidata",
  title:item.label||title,
  year:"",
  description:item.description||"No description available.",
  genres:"",
  rating:"",
  link:"https://www.wikidata.org/wiki/"+item.id
 }));
}

// RESULT CARD
function resultHTML(item){
 const link=safeURL(item.link);

 return `
 <article class="result">
  <div class="source">${escapeHTML(item.source)}</div>
  <h3>${escapeHTML(item.title)}</h3>
  <p>
   ${escapeHTML(item.year||"")}
   ${item.rating?" · Rating: "+escapeHTML(item.rating):""}
  </p>
  <p>${escapeHTML(item.description||"No description available.")}</p>
  ${item.genres?`<p><b>Genres:</b> ${escapeHTML(item.genres)}</p>`:""}
  ${link?`<p><a href="${escapeHTML(link)}" target="_blank" rel="noopener">View source details ↗</a></p>`:""}
 </article>`;
}

// ---------- POSTER DETAILS ----------

async function details(p){
 const modal=$("detailModal");
 const area=$("detailContent");

 modal.classList.add("show");

 const poster=escapeHTML(publicPoster(p.poster_path));

 area.innerHTML=`
 <div class="detail">
  <img src="${poster}" alt="${escapeHTML(p.title)}">
  <div>
   <h2>${escapeHTML(p.title)}</h2>
   <p>${escapeHTML(p.category||"Entertainment")}</p>
   ${isAdmin?`
    <button class="action" id="editEntryBtn">Edit entry</button>
    <button class="action danger" id="deleteEntryBtn">Delete entry</button>
   `:""}
  </div>
 </div>
 <h3>Information from free databases</h3>
 <p id="fetchStatus" class="status">Starting searches...</p>
 <div id="externalResults"></div>
 `;

 if(isAdmin){
  $("editEntryBtn").addEventListener("click",()=>editEntry(p));
  $("deleteEntryBtn").addEventListener("click",()=>deleteEntry(p));
 }

 const sources=[
  {name:"TVmaze",run:()=>searchTVmaze(p.title)},
  {name:"Jikan",run:()=>searchJikan(p.title)},
  {name:"AniList",run:()=>searchAniList(p.title)},
  {name:"Wikidata",run:()=>searchWikidata(p.title)}
 ];

 const resultArea=$("externalResults");
 const status=$("fetchStatus");
 let found=0;
 let completed=0;
 let failures=[];

 resultArea.innerHTML="";

 // Run sources independently. A failed source won't stop other sources.
 const jobs=sources.map(async source=>{
  try{
   status.textContent="Searching "+source.name+"...";

   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),15000);

   try{
    const results=await Promise.race([
     source.run(),
     new Promise((_,reject)=>{
      controller.signal.addEventListener("abort",()=>reject(new Error("Request timed out")));
     })
    ]);

    if(results&&results.length){
     found+=results.length;
     resultArea.insertAdjacentHTML(
      "beforeend",
      results.map(resultHTML).join("")
     );
    }else{
     resultArea.insertAdjacentHTML(
      "beforeend",
      `<p class="notice">${escapeHTML(source.name)}: No matching results.</p>`
     );
    }
   }finally{
    clearTimeout(timeout);
   }
  }catch(error){
   failures.push(source.name+": "+error.message);
   resultArea.insertAdjacentHTML(
    "beforeend",
    `<p class="notice">${escapeHTML(source.name)} unavailable: ${escapeHTML(error.message)}</p>`
   );
  }finally{
   completed++;
   status.textContent="Checked "+completed+" of "+sources.length+" databases. Found "+found+" results.";
  }
 });

 await Promise.allSettled(jobs);

 if(found===0){
  resultArea.insertAdjacentHTML(
   "afterbegin",
   '<p class="notice">No matching external information was found. Check the title spelling or try again later.</p>'
  );
 }

 status.textContent="Search finished. "+found+" results found from "+sources.length+" sources.";

 resultArea.insertAdjacentHTML(
  "beforeend",
  '<p class="notice">Details are supplied by independent public databases and may be incomplete or inaccurate.</p>'
 );
}

// CLOSE DETAILS
$("closeBtn").addEventListener("click",()=>{
 $("detailModal").classList.remove("show");
});

$("detailModal").addEventListener("click",e=>{
 if(e.target===$("detailModal")){
  $("detailModal").classList.remove("show");
 }
});

// ---------- ADMIN LOGIN ----------

function showAdmin(user){
 isAdmin=!!user&&user.app_metadata?.role==="admin";

 if(isAdmin){
  $("login").style.display="none";
  $("upload").style.display="block";
  $("admin").classList.add("show");
 }else{
  $("login").style.display="block";
  $("upload").style.display="none";
 }
}

async function login(){
 const email=$("email").value.trim();
 const password=$("password").value;
 const msg=$("loginMessage");

 msg.textContent="Signing in...";

 if(!email||!password){
  msg.textContent="Please enter your email and password.";
  return;
 }

 const {data,error}=await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  msg.textContent="Login failed: "+error.message;
  return;
 }

 if(data.user?.app_metadata?.role!=="admin"){
  await db.auth.signOut();
  msg.textContent="This account is not authorized as Admin. Check the admin role in Supabase.";
  return;
 }

 msg.textContent="Admin login successful.";
 showAdmin(data.user);
}

$("loginBtn").addEventListener("click",login);

$("password").addEventListener("keydown",e=>{
 if(e.key==="Enter")login();
});

// ---------- UPLOAD POSTER ----------

async function addEntry(){
 const title=$("title").value.trim();
 const file=$("poster").files[0];
 const selectedCategory=$("entryCategory").value;
 const msg=$("message");

 if(!title||!file){
  msg.textContent="Enter a title and choose a poster.";
  return;
 }

 if(file.size>8*1024*1024){
  msg.textContent="Poster must be under 8 MB.";
  return;
 }

 const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
 const path=crypto.randomUUID()+"."+ext;

 msg.textContent="Uploading poster...";

 const up=await db.storage.from("posters").upload(
  path,file,{contentType:file.type}
 );

 if(up.error){
  msg.textContent="Upload failed: "+up.error.message;
  return;
 }

 const ins=await db.from("entries").insert({
  title,
  category:selectedCategory,
  poster_path:path
 });

 if(ins.error){
  msg.textContent="Database error: "+ins.error.message;
  return;
 }

 msg.textContent="Poster added successfully!";
 $("title").value="";
 $("poster").value="";
 await load();
}

// EDIT ENTRY
async function editEntry(p){
 const newTitle=prompt("Edit title:",p.title);
 if(newTitle===null||!newTitle.trim())return;

 const categories=[
  "Movie","TV Series","Web Series","Anime","Animation","Documentary"
 ];

 const newCategory=prompt(
  "Enter category: "+categories.join(", "),
  p.category||"Movie"
 );

 if(newCategory===null)return;

 if(!categories.includes(newCategory.trim())){
  alert("Please enter one of the listed categories exactly.");
  return;
 }

 const {error}=await db.from("entries").update({
  title:newTitle.trim(),
  category:newCategory.trim()
 }).eq("id",p.id);

 if(error){
  alert("Update failed: "+error.message);
  return;
 }

 $("detailModal").classList.remove("show");
 await load();
}

// DELETE ENTRY
async function deleteEntry(p){
 if(!confirm("Delete "+p.title+"? This cannot be undone."))return;

 const {error}=await db.from("entries").delete().eq("id",p.id);

 if(error){
  alert("Delete failed: "+error.message);
  return;
 }

 $("detailModal").classList.remove("show");
 await load();
}

// SIGN OUT
async function logout(){
 await db.auth.signOut();
 showAdmin(null);
 $("loginMessage").textContent="You have signed out.";
 $("message").textContent="";
}

$("uploadBtn").addEventListener("click",addEntry);
$("logoutBtn").addEventListener("click",logout);

// RESTORE LOGIN AFTER REFRESH
db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_IN"||event==="INITIAL_SESSION"){
  showAdmin(session?.user||null);
 }
 if(event==="SIGNED_OUT"){
  showAdmin(null);
 }
});

// START WEBSITE
async function start(){
 const {data,error}=await db.auth.getSession();

 if(!error){
  showAdmin(data.session?.user||null);
 }

 await load();
}

start();
</script>
</body>
</html>
